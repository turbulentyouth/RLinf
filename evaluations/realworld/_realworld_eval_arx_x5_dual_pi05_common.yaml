# ARX X5 双臂 + OpenPI pi0.5 两机评估共享配置。
# 该文件由正式运行和两种 dry-run 主配置复用，不应直接启动。

defaults:
  - env/realworld_arx_x5_dual_joint@env.eval
  - model/pi0_5@rollout.model
  - _self_
  - override hydra/job_logging: stdout

cluster:
  num_nodes: 2
  component_placement:
    rollout:
      node_group: inference
      placement: 0
    env:
      node_group: robot
      placement: 0
  node_groups:
    - label: inference
      node_ranks: 0
    - label: robot
      node_ranks: 1
      env_configs:
        - node_ranks: 1
          python_interpreter_path: /home/xi/Downloads/RLinf/.venv/bin/python3

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: arx-x5-dual-openpi
    experiment_name: "realworld-eval-arx-x5-dual-pi05"
    logger_backends: ["tensorboard"]
  max_epochs: 1
  max_steps: 1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
  # 持续执行短评测周期，直到终端收到 Ctrl+C。max_cycles=null 表示不限制周期数。
  continuous_eval:
    enabled: true
    max_cycles: null

# 评测启动时自动检测 checkpoint 格式：PyTorch 直接加载，JAX 自动转换；
# 如果转换产物完整，则直接复用。未指定输出目录时默认写到 <输入目录>_torch。
checkpoint_conversion:
  enabled: true
  checkpoint_path: /home/li/hubo/RLinf/30000_torch
  converted_checkpoint_dir: ${oc.env:ARX_PI05_TORCH_CHECKPOINT,null}
  resolved_checkpoint_dir: null
  config_name: ${rollout.model.openpi.config_name}
  precision: "bfloat16"

env:
  group_name: "EnvGroup"
  enable_offload: false
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    group_size: 1
    auto_reset: false
    ignore_terminations: false
    is_eval: true
    max_episode_steps: 300
    # 每个周期只执行 5 次推理，让 Ctrl+C 最多等待一个短周期即可安全停止。
    max_steps_per_rollout_epoch: 5
    override_cfg:
      dry_run: false
      is_dummy: false
      left_interface: ${oc.env:ARX_LEFT_INTERFACE,can1}
      right_interface: ${oc.env:ARX_RIGHT_INTERFACE,can3}
      head_camera_serial: ${oc.env:ARX_HEAD_CAMERA_SERIAL}
      left_wrist_camera_serial: ${oc.env:ARX_LEFT_CAMERA_SERIAL}
      right_wrist_camera_serial: ${oc.env:ARX_RIGHT_CAMERA_SERIAL}
      task_description: "centre the blue cube, stack green cube on top of the blue cube, stack yellow cube on top of the green cube, stack red cube on top of the yellow cube."
      max_num_steps: 300
      # 只在环境生命周期内第一次 reset 时移动；持续推理的后续周期不会重复移动。
      start_position:
        enabled: true
        move_in_hardware_dry_run: false
        left_joints: [0.0, 0.948, 0.858, -0.573, 0.0, 0.0]
        right_joints: [0.0, 0.948, 0.858, -0.573, 0.0, 0.0]
        left_gripper: null
        right_gripper: null
        duration: 30.0
        control_frequency: 50.0
        max_joint_delta: 1.2
        max_final_error: 0.15
        max_control_lag: 0.25

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: false
  collect_prev_infos: false
  model:
    # 启动前会被自动准备流程替换为最终可加载的 PyTorch checkpoint 路径。
    model_path: ${checkpoint_conversion.checkpoint_path}
    precision: null
    num_action_chunks: 1
    action_dim: 14
    num_steps: 5
    add_value_head: false
    openpi:
      config_name: "pi05_arx_x5_dual"
      num_images_in_input: 3
      train_expert_only: false
      detach_critic_input: true
      action_chunk: ${rollout.model.num_action_chunks}
      action_env_dim: ${rollout.model.action_dim}
      num_steps: ${rollout.model.num_steps}
      add_value_head: ${rollout.model.add_value_head}
    openpi_data:
      repo_id: Xense/stack_cubes_0722
      norm_stats_path: /home/li/hubo/RLinf/30000/assets/Xense/stack_cubes_0722
