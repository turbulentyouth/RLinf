# 两机 + 真实 ARX 硬件 dry-run。
#
# 机器人电脑会连接左右 CAN 和三路相机，持续读取真实状态和图像；控制器始终
# 保持阻尼/被动模式。服务器仍执行完整 pi0.5 推理，但候选动作不会发送到机械臂。

defaults:
  - _realworld_eval_arx_x5_dual_pi05_common
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

runner:
  logger:
    experiment_name: "realworld-eval-arx-x5-dual-pi05-dryrun-hardware"

env:
  eval:
    max_episode_steps: 5
    max_steps_per_rollout_epoch: 5
    override_cfg:
      dry_run: true
      is_dummy: false
      max_num_steps: 5
