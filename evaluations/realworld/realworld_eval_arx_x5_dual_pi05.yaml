# ARX X5 双臂 + OpenPI pi0.5 两机正式推理配置。
#
# 节点 0（GPU 服务器）：运行 eval 入口和 rollout，仅负责模型推理。
# 节点 1（机器人电脑）：读取真实相机/关节状态并向机械臂下发动作。
#
# 机器人 Python、PyTorch checkpoint、norm stats 和数据集 repo_id 已固定在
# 共用配置中。正式推理仍需通过 ARX_*_CAMERA_SERIAL 设置三路 RealSense 序列号。

defaults:
  - _realworld_eval_arx_x5_dual_pi05_common
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/
