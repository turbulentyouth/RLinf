# 两机 + 无机械臂/无相机 distributed dry-run。
#
# 节点 0 仍加载 pi0.5 并执行真实模型推理；节点 1 仍运行 RealWorld Env Worker，
# 但使用零图像和内存关节状态，不导入 pyarx、不检查 CAN、也不打开相机。

defaults:
  - _realworld_eval_arx_x5_dual_pi05_common
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

runner:
  logger:
    experiment_name: "realworld-eval-arx-x5-dual-pi05-dryrun-distributed"

env:
  eval:
    max_episode_steps: 5
    max_steps_per_rollout_epoch: 5
    override_cfg:
      dry_run: false
      is_dummy: true
      head_camera_serial: null
      left_wrist_camera_serial: null
      right_wrist_camera_serial: null
      max_num_steps: 5
      start_position:
        enabled: false
