defaults:
  - model/recap_value_model@advantage.model

advantage:
  value_checkpoint: "/path/to/value_sft/checkpoints/global_step_N/actor"
  batch_size: 32
  flush_interval: 256
  num_dataloader_workers_per_gpu: 2
  prefetch_factor: 2
  discount_next_value: true
  positive_quantile: 0.3
  tag: "recap"
  returns_tag: "success"
  model:
    critic_expert_variant: "gemma_1m"
    tokenizer_path: "/path/to/gemma-3-270m"
    siglip_path: "/path/to/siglip2-so400m-patch14-224"
    gemma3_path: "/path/to/gemma-3-270m"

data:
  model_type: "pi05"
  train_data_paths:
    - dataset_path: "/path/to/stack-cubes-flexiv"
      robot_type: "bi_flexiv"
      type: "sft"
      weight: 1.0
  advantage_lookahead_step: 10
  gamma: 1.0

distributed:
  enabled: false
  backend: "nccl"
  timeout: 3600

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/
  job:
    chdir: false
