defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "cfg_rl_bi_flexiv"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  val_check_interval: -1
  save_interval: 250

data:
  num_workers: 4
  advantage_tag: "recap"
  balance_dataset_weights: true
  seed: 42
  train_data_paths:
    - dataset_path: "/path/to/stack-cubes-flexiv"
      type: "sft"
      weight: 1.0

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 8
  seed: 0
  model:
    precision: null
    model_path: "/path/to/pi05_base_pytorch"
    model_type: "cfg_model"
    add_value_head: false
    action_dim: 20
    num_action_chunks: 1
    openpi:
      config_name: "pi05_bi_flexiv"
      cfgrl_guidance_scale: 1.0
      unconditional_prob: 0.1
      train_expert_only: false
      guidance_type: "positive"
      positive_only_conditional: true
      num_images_in_input: 3
      action_horizon: 50
  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: "cosine"
    lr_warmup_steps: 100
    total_training_steps: 5000
    min_lr: 0.0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: false
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
