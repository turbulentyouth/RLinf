defaults:
  - model/recap_value_model@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "recap_bi_flexiv_value_sft"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  val_check_interval: -1
  save_interval: 250

data:
  tag: "success"
  train_data_paths:
    - dataset_path: "/path/to/stack-cubes-flexiv"
      type: "sft"
      weight: 1.0
      robot_type: "bi_flexiv"
      model_type: "pi05"
  eval_data_paths: []
  train_num_workers: 4
  eval_num_workers: 0
  prefetch_factor: 2
  persistent_workers: false
  pin_memory: true
  include_state: true
  gamma: 1.0
  action_horizon: 50
  normalize_to_minus_one_zero: true
  include_next_obs: false
  action_dim: 20
  robot_type: "bi_flexiv"
  model_type: "pi05"
  balance_weights: true
  seed: 42

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 16
  seed: 0
  model:
    precision: bf16
    siglip_path: "/path/to/siglip2-so400m-patch14-224"
    gemma3_path: "/path/to/gemma-3-270m"
    tokenizer_path: "/path/to/gemma-3-270m"
    freeze_vlm: false
    action_dim: 20
    action_horizon: 50
  optim:
    lr: 5.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: "constant"
    lr_warmup_steps: 100
    total_training_steps: 5000
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: false
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
