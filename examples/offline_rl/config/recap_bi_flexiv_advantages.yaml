# Usage:
#   bash examples/offline_rl/advantage_labeling/recap/process/run_compute_advantages.sh recap_bi_flexiv_advantages \
#       advantage.value_checkpoint=/path/to/value_checkpoint
#
# 为 bi-Flexiv 双臂数据集计算 advantage。
# robot_type=bi_flexiv 对应 compute_advantages.py 的 KEY_MAPPINGS 与
# value_dataset.py 的 _REPACK_KEYS (三相机 + 20 维 state)。

defaults:
  - model/recap_value_model@advantage.model

advantage:
  value_checkpoint: /path/to/value_checkpoint
  batch_size: 1024
  flush_interval: 256
  num_dataloader_workers_per_gpu: 12
  prefetch_factor: 2
  discount_next_value: true
  positive_quantile: 0.3
  # 接管帧 (observation.is_intervention == 1) 按 (episode_index, frame_index)
  # 匹配后强制标记为 positive advantage。
  treat_intervention_as_positive: true
  tag: null
  returns_tag: null

  model:
    critic_expert_variant: "gemma_1m"
    tokenizer_path: /path/to/gemma-3-270m
    siglip_path: /path/to/siglip2-so400m-patch14-224
    gemma3_path: /path/to/gemma-3-270m

data:
  # openpi 变体，须与 value model 训练时一致 ("pi0" / "pi05")。
  model_type: "pi05"

  train_data_paths:
    - dataset_path: /path/to/Xense/stack-cubes-flexiv-0813
      robot_type: "bi_flexiv"
      type: "rollout"
      weight: 1.0

  advantage_lookahead_step: 10
  gamma: 1.0

distributed:
  enabled: true
  backend: "nccl"
  timeout: 3600

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/
  job:
    chdir: false
